[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 3000

# Branch deploys and deploy previews are enabled in the Netlify UI; see
# docs/ENVIRONMENTS.md. They inherit the [build] command above, so no
# per-context overrides are needed. Add a [context.*] block here only when a
# context genuinely needs to build differently.
