[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Netlify fails the build when any environment variable's value appears in
  # the repo. APP_URL is the public site URL, which the README links to.
  SECRETS_SCAN_OMIT_KEYS = "APP_URL"

[dev]
  command = "npm run dev"
  targetPort = 3000

# The production branch and deploy previews are set in the Netlify UI; see
# docs/ENVIRONMENTS.md. Every context inherits the [build] command above, so no
# per-context overrides are needed. Add a [context.*] block here only when a
# context genuinely needs to build differently.
