[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 3000

# The production branch and deploy previews are set in the Netlify UI; see
# docs/ENVIRONMENTS.md. Every context inherits the [build] command above, so no
# per-context overrides are needed. Add a [context.*] block here only when a
# context genuinely needs to build differently.
